<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRIME AI - Genjutsu</title>
<style>
body{background:#0a0a0a;color:white;font-family:sans-serif;margin:0}
header{padding:15px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:22px;font-weight:900} .logo span{color:#a3ff00}
.btn{background:#a3ff00;color:black;border:none;padding:10px 18px;border-radius:20px;font-weight:800}
.banner{background:linear-gradient(90deg,#1a1a1a,#2a2a00);margin:15px;padding:20px;border-radius:15px}
.tabs{display:flex;gap:10px;margin:15px}
.tab{padding:10px 16px;border-radius:20px;background:#222;border:1px solid #333;cursor:pointer}
.tab.active{background:#a3ff00;color:black}
.card{background:#151515;margin:15px;padding:15px;border-radius:15px}
input{width:100%;padding:12px;margin:8px 0;border-radius:10px;background:#222;border:1px solid #333;color:white}
.upload{border:2px dashed #444;padding:20px;text-align:center;border-radius:12px;margin:10px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:15px}
.grid img{width:100%;border-radius:12px}
</style>
</head>
<body>

<header>
<div class="logo">PRIME<span> AI</span></div>
<button class="btn">Upgrade</button>
</header>

<div class="banner">
<h2>GENJUTSU</h2>
<p>Transfer motion to your characters or objects while keeping the rest unchanged.</p>
<button class="btn" onclick="document.getElementById('studio').scrollIntoView()">Start generating →</button>
</div>

<div class="tabs">
<div class="tab active" id="tabA" onclick="switchMode('A')">🔥 Motion Transfer</div>
<div class="tab" id="tabB" onclick="switchMode('B')">👕 Outfit Swap</div>
</div>

<div class="card" id="studio">
<h3 id="title">A) Motion Transfer</h3>
<p id="desc">Upload your photo + a motion video. PRIME puts the motion on your photo.</p>

<div class="upload">📸 <b>1. Your Character Photo</b><br><input type="file" accept="image/*"></div>
<div class="upload">🎬 <b>2. Motion Video</b><br><input type="file" accept="video/*"></div>

<input type="text" id="prompt" placeholder="e.g. Make him dance Azonto in Accra, keep face same">
<button class="btn" style="width:100%;padding:15px" onclick="generate()">✨ GENERATE PRIME VIDEO</button>
<p id="status" style="text-align:center"></p>
</div>

<div style="padding:0 15px"><h3>Community Trending</h3></div>
<div class="grid">
<img src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=400">
<img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=400">
<img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=400">
<img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=400">
</div>

<script>
let mode='A';
function switchMode(m){
  mode=m;
  document.getElementById('tabA').classList.toggle('active',m==='A');
  document.getElementById('tabB').classList.toggle('active',m==='B');
  if(m==='A'){
    document.getElementById('title').innerText='A) Motion Transfer';
    document.getElementById('desc').innerText='Upload your photo + a motion video. PRIME puts the motion on your photo.';
  } else {
    document.getElementById('title').innerText='B) Outfit Background Swap';
    document.getElementById('desc').innerText='Upload your photo + outfit photo. PRIME swaps outfit & background, keeps your face.';
  }
}
function generate(){
  document.getElementById('status').innerText='⏳ PRIME is generating... (Demo mode - connect API next)';
  setTimeout(()=>{ document.getElementById('status').innerText='✅ Done! This is your PRIME Genjutsu demo. Connect Higgsfield / Seedance API to make it real.' },2000);
}
</script>
</body>
</html>
